<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox Cloud Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
        }
        .poster-fit {
            object-fit: fill;
            width: 100%;
            height: 100%;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #18181b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <nav class="bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('user')">
                <div class="p-2 bg-blue-600 rounded-xl text-white font-bold text-lg">🎬</div>
                <span class="font-extrabold text-lg tracking-wide bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                    MovieBox
                </span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="nav-btn-user" onclick="navigateTo('user')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-lg transition">
                    🌐 Utama
                </button>
                <button id="nav-btn-admin" onclick="navigateTo('admin')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition">
                    ⚙️ Admin Panel
                </button>
            </div>
        </div>
    </nav>

    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-zinc-800 text-xs"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">

        <section id="view-user" class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800/80">
                <div class="flex items-center gap-3">
                    <select id="category-filter" onchange="filterCatalog()" class="bg-zinc-900 text-xs font-bold text-white px-3 py-2 rounded-xl border border-zinc-800 focus:outline-none">
                        <option value="ALL">Kategori: Semua</option>
                    </select>
                </div>
                <input type="text" id="user-search" oninput="filterCatalog()" placeholder="🔍 Cari film atau anime..."
                    class="w-full sm:w-72 bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-blue-500 text-white" />
            </div>

            <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-5"></div>
        </section>

        <section id="view-admin" class="hidden space-y-6">
            <div class="flex items-center justify-between bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl font-bold">⚙️</div>
                    <div>
                        <h2 class="text-sm font-bold">MovieBox Dashboard Admin</h2>
                        <span class="text-[10px] text-emerald-400 font-mono">● Mode Admin Aktif</span>
                    </div>
                </div>
                <button onclick="navigateTo('user')" class="px-3 py-1.5 bg-zinc-800 text-xs font-bold rounded-xl border border-zinc-700 hover:bg-zinc-700">
                    🌐 Kembali Ke Website
                </button>
            </div>

            <div class="flex border-b border-zinc-800">
                <button id="tab-btn-uploader" onclick="switchAdminTab('uploader')" class="px-5 py-3 font-bold text-xs border-b-2 border-blue-500 text-blue-400">
                    1. Remote Uploader Batch & Auto TMDB
                </button>
                <button id="tab-btn-health" onclick="switchAdminTab('health')" class="px-5 py-3 font-bold text-xs text-zinc-400 hover:text-white">
                    2. Kelola Katalog & Health Checker
                </button>
            </div>

            <div id="tab-content-uploader" class="space-y-4">
                <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 space-y-3">
                    <label class="block text-xs font-bold text-zinc-300">Direct Video URL / Link Video (Maksimal 10 Link, 1 Per Baris)</label>
                    <textarea id="batch-urls" rows="4" placeholder="Paste link di sini...&#10;https://drive.usercontent.google.com/download?id=..."
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-blue-500 custom-scrollbar"></textarea>
                    
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                        <span class="text-[10px] text-blue-400">🤖 Sistem mengekstrak metadata otomatis dari TMDB & iTunes</span>
                        <button onclick="processBatchPreview()" class="w-full sm:w-auto px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg">
                            🔍 Preview & Auto-Fetch TMDB (Max 10 Link)
                        </button>
                    </div>
                </div>

                <div id="preview-container" class="space-y-3"></div>

                <div id="transfer-action-container" class="hidden">
                    <button onclick="saveAllToCatalog()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg">
                        🚀 Simpan Semua ke Katalog
                    </button>
                </div>
            </div>

            <div id="tab-content-health" class="hidden space-y-4">
                <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-xs">Google Drive Health Checker</h3>
                        <p class="text-[10px] text-zinc-400">Diagnosis status link video secara real-time</p>
                    </div>
                    <button onclick="runHealthCheck()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl">
                        🔍 Jalankan Diagnosis Semua Link
                    </button>
                </div>

                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
                    <table class="w-full text-left text-xs text-zinc-300">
                        <thead class="bg-zinc-950 text-zinc-400 uppercase font-mono border-b border-zinc-800">
                            <tr>
                                <th class="p-3">Judul Film</th>
                                <th class="p-3">Status Google Drive</th>
                                <th class="p-3">Ukuran File</th>
                                <th class="p-3 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="health-table-body" class="divide-y divide-zinc-800"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <div id="player-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4">
        <div class="relative w-full max-w-4xl bg-zinc-950 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[95vh]">
            <div class="p-3 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
                <div class="truncate pr-4">
                    <h2 id="player-title" class="text-xs sm:text-sm font-bold text-white truncate"></h2>
                    <p id="player-genre" class="text-[10px] text-zinc-400 truncate"></p>
                </div>
                <button onclick="closePlayer()" class="w-8 h-8 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white flex items-center justify-center transition shrink-0">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
            <div class="relative aspect-video w-full bg-black flex items-center justify-center">
                <video id="video-element" controls controlsList="nodownload" preload="metadata" class="w-full h-full object-contain"></video>
            </div>
            <div class="p-3 sm:p-4 bg-zinc-900/40 overflow-y-auto custom-scrollbar">
                <p id="player-desc" class="text-xs text-zinc-400 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        let movieCatalog = [];
        let previewQueue = [];
        let currentPlayingMovieId = null;
        let lastPlayedTime = 0;
        let isRecovering = false;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.className = `fixed bottom-5 right-5 z-50 bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-2xl border text-xs ${isError ? 'border-red-500/50 text-red-300' : 'border-blue-500/50 text-blue-300'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        async function fetchMovies() {
            try {
                const res = await fetch('/api/movies');
                const data = await res.json();
                if (data && Array.isArray(data.movies)) {
                    movieCatalog = shuffleArray(data.movies);
                }
            } catch (e) {
                movieCatalog = [];
            } finally {
                updateCategoryDropdown();
                renderCatalog();
            }
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('category-filter');
            if (!select) return;
            const genres = new Set();
            movieCatalog.forEach(m => {
                if (m.genre) {
                    m.genre.split(',').forEach(g => genres.add(g.trim()));
                }
            });
            select.innerHTML = '<option value="ALL">Kategori: Semua</option>';
            genres.forEach(g => {
                select.innerHTML += `<option value="${g}">${g}</option>`;
            });
        }

        function navigateTo(view) {
            const userView = document.getElementById('view-user');
            const adminView = document.getElementById('view-admin');
            const btnUser = document.getElementById('nav-btn-user');
            const btnAdmin = document.getElementById('nav-btn-admin');

            if (view === 'admin') {
                userView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btnAdmin.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-lg transition";
                btnUser.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition";
                renderHealthTable();
            } else {
                adminView.classList.add('hidden');
                userView.classList.remove('hidden');
                btnUser.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-lg transition";
                btnAdmin.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition";
                renderCatalog();
            }
        }

        function switchAdminTab(tab) {
            const uploader = document.getElementById('tab-content-uploader');
            const health = document.getElementById('tab-content-health');
            const btnUp = document.getElementById('tab-btn-uploader');
            const btnHealth = document.getElementById('tab-btn-health');

            if (tab === 'uploader') {
                uploader.classList.remove('hidden');
                health.classList.add('hidden');
                btnUp.className = "px-5 py-3 font-bold text-xs border-b-2 border-blue-500 text-blue-400";
                btnHealth.className = "px-5 py-3 font-bold text-xs text-zinc-400 hover:text-white";
            } else {
                uploader.classList.add('hidden');
                health.classList.remove('hidden');
                btnHealth.className = "px-5 py-3 font-bold text-xs border-b-2 border-blue-500 text-blue-400";
                btnUp.className = "px-5 py-3 font-bold text-xs text-zinc-400 hover:text-white";
                renderHealthTable();
            }
        }

        function renderCatalog(items = movieCatalog) {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-zinc-500 text-xs">Belum ada film di katalog.</div>`;
                return;
            }

            items.forEach(movie => {
                const card = document.createElement('div');
                card.className = "group relative bg-zinc-900/70 rounded-2xl overflow-hidden border border-zinc-800/80 hover:border-blue-500/50 transition duration-300 flex flex-col cursor-pointer shadow-lg";
                card.onclick = () => openPlayer(movie);

                const poster = movie.poster || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800';

                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full bg-zinc-950 overflow-hidden">
                        <img src="${poster}" loading="lazy" decoding="async" alt="${movie.title}" class="poster-fit" onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800'">
                        <div class="absolute top-2 left-2 bg-blue-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-md shadow">
                            ${movie.year || '2026'}
                        </div>
                    </div>
                    <div class="p-2.5 flex flex-col items-center justify-center text-center flex-grow bg-zinc-900">
                        <h3 class="text-xs font-bold text-white line-clamp-2 leading-snug group-hover:text-blue-400 transition">${movie.title}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCatalog() {
            const query = document.getElementById('user-search').value.toLowerCase();
            const category = document.getElementById('category-filter').value;

            const filtered = movieCatalog.filter(m => {
                const matchCat = category === 'ALL' || (m.genre && m.genre.toLowerCase().includes(category.toLowerCase()));
                const matchSearch = !query || (m.title && m.title.toLowerCase().includes(query));
                return matchCat && matchSearch;
            });

            renderCatalog(filtered);
        }

        function openPlayer(movie) {
            currentPlayingMovieId = movie.driveId;
            lastPlayedTime = 0;
            isRecovering = false;

            document.getElementById('player-title').innerText = movie.title || 'Untitled';
            document.getElementById('player-genre').innerText = `${movie.genre || 'General'} • ${movie.year || '2026'}`;
            document.getElementById('player-desc').innerText = movie.description || 'Tidak ada deskripsi sinopsis.';

            const video = document.getElementById('video-element');
            video.src = `/api/stream?id=${movie.driveId}`;

            const modal = document.getElementById('player-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            video.play().catch(() => {});
        }

        function closePlayer() {
            const video = document.getElementById('video-element');
            video.pause();
            video.src = '';
            currentPlayingMovieId = null;
            lastPlayedTime = 0;
            const modal = document.getElementById('player-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        const video = document.getElementById('video-element');

        video.addEventListener('timeupdate', () => {
            if (video.currentTime > 0) {
                lastPlayedTime = video.currentTime;
            }
        });

        video.addEventListener('stalled', handleStreamStall);
        video.addEventListener('waiting', () => {
            setTimeout(() => {
                if (video.readyState < 3 && !video.paused) {
                    handleStreamStall();
                }
            }, 4000);
        });

        function handleStreamStall() {
            if (isRecovering || !currentPlayingMovieId) return;
            isRecovering = true;
            showToast('Menyambung ulang koneksi video...');

            const currentTime = lastPlayedTime;
            video.src = `/api/stream?id=${currentPlayingMovieId}&t=${Date.now()}`;
            video.load();

            video.oncanplay = () => {
                if (currentTime > 0) {
                    video.currentTime = currentTime;
                }
                video.play().catch(() => {});
                isRecovering = false;
                video.oncanplay = null;
            };
        }

        async function processBatchPreview() {
            const text = document.getElementById('batch-urls').value.trim();
            if (!text) {
                showToast('Masukkan minimal 1 URL', true);
                return;
            }

            const urls = text.split('\n').map(l => l.trim()).filter(l => l.length > 0).slice(0, 10);
            showToast('Mengekstrak metadata...');

            try {
                const res = await fetch('/api/upload/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });

                const data = await res.json();
                if (data.success) {
                    previewQueue = data.items.map((item, idx) => ({
                        id: 'prev_' + Date.now() + '_' + idx,
                        ...item
                    }));
                    renderPreviewQueue();
                    document.getElementById('transfer-action-container').classList.remove('hidden');
                }
            } catch (e) {
                showToast('Gagal mengekstrak preview', true);
            }
        }

        function renderPreviewQueue() {
            const container = document.getElementById('preview-container');
            container.innerHTML = '';

            previewQueue.forEach((item, index) => {
                const card =
